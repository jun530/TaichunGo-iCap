{% extends "base.html" %}

{% block content %}
<main class="container py-5">
    <div class="mb-4">
        <p class="text-success fw-bold mb-1">Attraction List</p>
        <h1 class="section-title">台中景點探索</h1>
        <p class="text-secondary">用關鍵字、地區與分類快速找到適合你的台中旅行目的地。</p>
    </div>

    <form id="attractionFilter" class="filter-panel p-3 p-md-4 mb-4" method="GET" action="/attractions">
        <div class="row g-3 align-items-end">
            <div class="col-md-4">
                <label for="keyword" class="form-label">關鍵字搜尋</label>
                <input id="keyword" name="keyword" class="form-control" placeholder="輸入景點名稱或介紹">
            </div>
            <div class="col-6 col-md-2">
                <label for="district" class="form-label">地區</label>
                <select id="district" name="district" class="form-select">
                    <option value="">全部地區</option>
                    {% for district in districts %}
                    <option value="{{ district }}">{{ district }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-6 col-md-2">
                <label for="category" class="form-label">分類</label>
                <select id="category" name="category" class="form-select">
                    <option value="">全部分類</option>
                    {% for category in categories %}
                    <option value="{{ category }}">{{ category }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-2">
                <label for="sort" class="form-label">排序</label>
                <select id="sort" name="sort" class="form-select">
                    <option value="id-asc">編號由小到大</option>
                    <option value="id-desc">編號由大到小</option>
                    <option value="name-asc">名稱排序</option>
                    <option value="created_at-desc">建立時間最新</option>
                </select>
            </div>
            <div class="col-md-2 d-flex gap-2">
                <button class="btn btn-teal flex-fill" type="submit">查詢</button>
                <button id="clearFilters" class="btn btn-outline-secondary" type="button">清除</button>
            </div>
        </div>
    </form>

    <p id="resultInfo" class="text-secondary" aria-live="polite"></p>
    <div id="ajaxStatus" class="visually-hidden" role="status" aria-live="polite"></div>
    <div id="listResult" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"></div>
    <div id="emptyState" class="alert alert-warning d-none mt-4">找不到符合條件的景點，請調整搜尋條件後再試。</div>
    <nav class="mt-4" aria-label="景點分頁">
        <ul id="pagination" class="pagination justify-content-center"></ul>
    </nav>
</main>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/list.js') }}"></script>
{% endblock %}
